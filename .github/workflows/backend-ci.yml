name: Backend CI

on:
  pull_request:
    paths: ['**', '!docs/**']
  push:
    branches: [main]
    paths: ['**', '!docs/**']

jobs:
  quality:
    name: Lint, Build, Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 18 reached EOL on 2025-04-30. testcontainers v11 pulls in
        # undici v6+, which relies on the global `File` Web API surfaced in
        # Node 20+, so the 18.x runner crashed on bullmq.integration.test.ts
        # with "ReferenceError: File is not defined". Drop 18.x from the
        # matrix until a contributor explicitly needs to backport.
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (zero warnings)
        run: npm run lint -- --max-warnings=0

      - name: Build (TypeScript)
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests (Docker available on ubuntu-latest)
        run: npm run test:integration

      - name: Coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 30

      - name: npm audit (block on high+ vulns)
        run: npm audit --audit-level=high
        continue-on-error: false

  mutation:
    name: Mutation testing (main only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-mutation-report
          path: reports/mutation/
          retention-days: 30
